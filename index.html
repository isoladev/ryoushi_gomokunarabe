<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量子五目並べ (Quantum Gomoku) - Online</title>
    <!-- Firebase SDK (v9/v10 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(20, 27, 45, 0.75);
            --panel-border: rgba(0, 240, 255, 0.2);
            --text-color: #e0f7fc;
            --accent-cyan: #00f0ff;
            --accent-magenta: #ff0055;
            --accent-gold: #ffb700;
            --font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 0, 85, 0.05) 0%, transparent 50%);
            color: var(--text-color);
            font-family: var(--font-family);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 10px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--accent-cyan), #ffffff, var(--accent-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .subtitle {
            font-size: 0.9rem;
            color: rgba(224, 247, 252, 0.6);
            margin-top: 5px;
        }

        .main-container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            max-width: 1100px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .game-panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .controls-panel {
            width: 340px;
        }

        .board-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        canvas {
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
            cursor: pointer;
            background-color: #121826;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            text-align: center;
            border: 1px solid transparent;
            width: 100%;
            box-sizing: border-box;
        }

        .status-my-turn {
            background: rgba(0, 240, 255, 0.25);
            color: #fff;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
            animation: pulse 1.5s infinite alternate;
        }

        .status-wait {
            background: rgba(255, 255, 255, 0.05);
            color: #aaa;
            border-color: rgba(255, 255, 255, 0.2);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 5px rgba(0, 240, 255, 0.4); }
            100% { box-shadow: 0 0 15px rgba(0, 240, 255, 0.8); }
        }

        .btn {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(0, 240, 255, 0.05));
            border: 1px solid var(--accent-cyan);
            color: #fff;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.4), rgba(0, 240, 255, 0.1));
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #555;
        }

        .btn-observe {
            background: linear-gradient(135deg, rgba(255, 183, 0, 0.3), rgba(255, 0, 85, 0.2));
            border-color: var(--accent-gold);
            color: #fff;
            font-size: 1rem;
            padding: 12px;
        }

        .btn-observe:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(255, 183, 0, 0.5), rgba(255, 0, 85, 0.4));
            box-shadow: 0 0 20px rgba(255, 183, 0, 0.5);
        }

        .btn-endturn {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            border-color: rgba(255, 255, 255, 0.4);
            color: #fff;
        }

        .mode-selector {
            display: flex;
            gap: 5px;
            background: rgba(0,0,0,0.3);
            padding: 4px;
            border-radius: 6px;
        }

        .mode-btn {
            flex: 1;
            padding: 8px 4px;
            font-size: 0.8rem;
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            border-radius: 4px;
        }

        .mode-btn.active {
            background: var(--accent-cyan);
            color: #000;
            font-weight: bold;
        }

        .online-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed var(--accent-cyan);
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .online-box input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            text-align: center;
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .room-id-display {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            padding: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-cyan);
        }

        .copy-btn {
            background: rgba(0, 240, 255, 0.2);
            border: 1px solid var(--accent-cyan);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .log-box {
            height: 120px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            padding: 8px;
            font-size: 0.8rem;
            overflow-y: auto;
            color: #aaa;
            display: flex;
            flex-direction: column-reverse;
        }

        .log-entry {
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 2px;
        }

        .banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 15, 25, 0.95);
            border: 2px solid var(--accent-cyan);
            border-radius: 12px;
            padding: 20px 30px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.5);
            z-index: 100;
            display: none;
            width: 80%;
        }

        .banner h2 {
            font-size: 1.8rem;
            color: var(--accent-gold);
            margin-bottom: 10px;
        }

        .action-choice-box {
            display: none;
            flex-direction: column;
            gap: 8px;
            background: rgba(255, 183, 0, 0.1);
            border: 1px solid var(--accent-gold);
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <header>
        <h1>QUANTUM GOMOKU</h1>
        <div class="subtitle">量子五目並べ - オンライン対戦版</div>
    </header>

    <div class="main-container">
        <!-- ボードエリア -->
        <div class="game-panel board-panel">
            <canvas id="board" width="540" height="540"></canvas>
            <div id="banner" class="banner">
                <h2 id="banner-title">勝敗確定</h2>
                <p id="banner-text">プレイヤー1の勝利！</p>
                <button class="btn" onclick="resetGame()" style="margin: 15px auto 0;">もう一度遊ぶ</button>
            </div>
        </div>

        <!-- コントロールエリア -->
        <div class="game-panel controls-panel">
            <!-- モード切替 -->
            <div class="mode-selector">
                <button class="mode-btn active" id="mode-p2p" onclick="setGameMode('p2p')">2P対戦</button>
                <button class="mode-btn" id="mode-ai" onclick="setGameMode('ai')">VS AI</button>
                <button class="mode-btn" id="mode-online" onclick="setGameMode('online')">🌐 オンライン</button>
            </div>

            <!-- オンライン対戦用パネル -->
            <div id="online-panel" class="online-box" style="display: none;">
                <div style="font-size:0.85rem; text-align:center;">ルームIDを作成または入力</div>
                <button class="btn" onclick="createOnlineRoom()" id="btn-create-room">✨ 新しいルームを作成</button>
                
                <div id="room-id-box" class="room-id-display" style="display:none;">
                    <span id="created-room-id">------</span>
                    <button class="copy-btn" onclick="copyRoomId()">コピー</button>
                </div>

                <div style="display:flex; gap:5px;" id="join-input-box">
                    <input type="text" id="room-input" placeholder="6桁コード" maxlength="6">
                    <button class="btn" onclick="joinOnlineRoom()">🚪 参加</button>
                </div>

                <div id="online-status" style="font-size:0.85rem; color:var(--accent-gold); text-align:center;"></div>
                
                <button class="btn" id="btn-ready" onclick="toggleReady()" style="display:none; background:linear-gradient(135deg, rgba(0,240,255,0.4), rgba(0,240,255,0.1)); border-color:var(--accent-cyan);">
                    🎮 対局開始準備 (Ready)
                </button>
            </div>

            <!-- プレイヤー情報 ＆ 手番ステータス -->
            <div>
                <div id="role-display" style="font-size:0.85rem; color:#888; margin-bottom:5px; text-align:center;">あなたは: ---</div>
                <div id="turn-display" class="status-badge status-wait">対局開始を待っています</div>
            </div>

            <!-- 確率表示 -->
            <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(0,0,0,0.2); padding:8px 12px; border-radius:6px;">
                <span style="font-size:0.85rem;">次の配置確率:</span>
                <strong id="next-prob-display" style="color:var(--accent-cyan); font-size:1.1rem;">90% 黒</strong>
            </div>

            <!-- 観測残数表示 -->
            <div style="display:flex; justify-content:space-between; gap:10px;">
                <div style="flex:1; background:rgba(0,0,0,0.2); padding:8px; border-radius:6px; text-align:center;">
                    <div style="font-size:0.75rem; color:#aaa;">P1 観測残り</div>
                    <div id="p1-obs-count" style="font-weight:bold; color:var(--accent-cyan); font-size:1.2rem;">5 回</div>
                </div>
                <div style="flex:1; background:rgba(0,0,0,0.2); padding:8px; border-radius:6px; text-align:center;">
                    <div style="font-size:0.75rem; color:#aaa;">P2 観測残り</div>
                    <div id="p2-obs-count" style="font-weight:bold; color:var(--accent-magenta); font-size:1.2rem;">5 回</div>
                </div>
            </div>

            <!-- 石配置後の選択アクション（観測するか手番終了か） -->
            <div id="action-choice-box" class="action-choice-box">
                <div style="font-size:0.85rem; text-align:center; color:var(--accent-gold); font-weight:bold;">
                    石を置きました。「観測」を行いますか？
                </div>
                <button id="btn-observe" class="btn btn-observe" onclick="triggerObservation()">
                    ⚛️ 観測を実行する (Collapse)
                </button>
                <button id="btn-endturn" class="btn btn-endturn" onclick="finishTurnWithoutObservation()">
                    ➡️ 観測せずにターン終了
                </button>
            </div>

            <!-- ログ -->
            <div>
                <div style="font-size:0.8rem; margin-bottom:4px; color:#888;">対局ログ</div>
                <div id="log-box" class="log-box"></div>
            </div>
        </div>
    </div>

    <script>
        // === ★★★ Firebase設定 (ここをご自身のキーに書き換えてください) ★★★ ===
        const firebaseConfig = {
            apiKey: "AIzaSyB1t_iHj6hF11l1Ja0d7NWCpfn_SsTbQBA",
            authDomain: "quantum-gomokunarabe.firebaseapp.com",
            databaseURL: "https://quantum-gomokunarabe-default-rtdb.firebaseio.com",
            projectId: "quantum-gomokunarabe",
            storageBucket: "quantum-gomokunarabe.firebasestorage.app",
            messagingSenderId: "373772002123",
            appId: "1:373772002123:web:debd6babbf6b3598e4fece",
            measurementId: "G-NVS6NX7B8Y"
         };

        // Firebase初期化
        let db = null;
        try {
            if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
            }
        } catch (e) {
            console.error("Firebase init error:", e);
        }

        // 定数設定
        const BOARD_SIZE = 15;
        const CELL_SIZE = 34;
        const PADDING = 32;

        // ゲーム状態
        let board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
        let turn = 'P1'; // P1 or P2
        let p1TurnCount = 0;
        let p2TurnCount = 0;
        let p1ObsLeft = 5;
        let p2ObsLeft = 5;
        let moveHistory = [];
        let gameMode = 'p2p'; // 'p2p', 'ai', 'online'
        let gameOver = false;
        let isMeasuring = false;
        let awaitActionChoice = false; // 石を置いた直後の選択待ちフラグ

        // オンライン設定
        let roomId = null;
        let myRole = null; // 'P1', 'P2'
        let p1Ready = false;
        let p2Ready = false;
        let gameStarted = false;

        // 音響（Web Audio API）
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;
                if (type === 'place') {
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'observe') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(880, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'revert') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.25);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'win') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    osc.frequency.setValueAtTime(783.99, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                }
            } catch(e) {}
        }

        // 次の石の黒確率
        function getNextBlackProbability(player, count) {
            if (player === 'P1') {
                return count % 2 === 0 ? 0.90 : 0.70;
            } else {
                return count % 2 === 0 ? 0.10 : 0.30;
            }
        }

        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d');

        function init() {
            canvas.addEventListener('click', handleCanvasClick);
            resetGame();
        }

        function resetGame() {
            board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
            turn = 'P1';
            p1TurnCount = 0;
            p2TurnCount = 0;
            p1ObsLeft = 5;
            p2ObsLeft = 5;
            moveHistory = [];
            gameOver = false;
            isMeasuring = false;
            awaitActionChoice = false;

            if (gameMode !== 'online') gameStarted = true;

            document.getElementById('banner').style.display = 'none';
            document.getElementById('action-choice-box').style.display = 'none';
            log("ゲームが開始されました。");
            updateUI();
            drawBoard();
        }

        function setGameMode(mode) {
            gameMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`mode-${mode}`).classList.add('active');
            
            document.getElementById('online-panel').style.display = mode === 'online' ? 'flex' : 'none';
            if (mode === 'online') {
                gameStarted = false;
                myRole = null;
            } else {
                gameStarted = true;
                myRole = null;
            }
            resetGame();
        }

        // 描画
        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 格子線
            ctx.strokeStyle = '#2a3b5c';
            ctx.lineWidth = 1;
            for (let i = 0; i < BOARD_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(PADDING, PADDING + i * CELL_SIZE);
                ctx.lineTo(PADDING + (BOARD_SIZE - 1) * CELL_SIZE, PADDING + i * CELL_SIZE);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(PADDING + i * CELL_SIZE, PADDING);
                ctx.lineTo(PADDING + i * CELL_SIZE, PADDING + (BOARD_SIZE - 1) * CELL_SIZE);
                ctx.stroke();
            }

            // 星
            const stars = [3, 7, 11];
            ctx.fillStyle = '#00f0ff';
            stars.forEach(r => {
                stars.forEach(c => {
                    ctx.beginPath();
                    ctx.arc(PADDING + c * CELL_SIZE, PADDING + r * CELL_SIZE, 3, 0, Math.PI * 2);
                    ctx.fill();
                });
            });

            // 石の描画
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const stone = board[r][c];
                    if (stone) {
                        const x = PADDING + c * CELL_SIZE;
                        const y = PADDING + r * CELL_SIZE;
                        const radius = CELL_SIZE * 0.42;

                        if (stone.collapsed) {
                            ctx.beginPath();
                            ctx.arc(x, y, radius, 0, Math.PI * 2);
                            if (stone.finalColor === 'black') {
                                ctx.fillStyle = '#111';
                                ctx.strokeStyle = '#00f0ff';
                            } else {
                                ctx.fillStyle = '#eee';
                                ctx.strokeStyle = '#ff0055';
                            }
                            ctx.lineWidth = 2;
                            ctx.fill();
                            ctx.stroke();
                        } else {
                            const prob = stone.blackProb;
                            
                            ctx.beginPath();
                            ctx.moveTo(x, y);
                            ctx.arc(x, y, radius, -Math.PI/2, -Math.PI/2 + Math.PI * 2 * prob);
                            ctx.fillStyle = '#1a1a24';
                            ctx.fill();

                            ctx.beginPath();
                            ctx.moveTo(x, y);
                            ctx.arc(x, y, radius, -Math.PI/2 + Math.PI * 2 * prob, -Math.PI/2 + Math.PI * 2);
                            ctx.fillStyle = '#e0f7fc';
                            ctx.fill();

                            ctx.beginPath();
                            ctx.arc(x, y, radius, 0, Math.PI * 2);
                            ctx.strokeStyle = stone.owner === 'P1' ? 'rgba(0,240,255,0.8)' : 'rgba(255,0,85,0.8)';
                            ctx.lineWidth = 2;
                            ctx.stroke();

                            ctx.fillStyle = prob >= 0.5 ? '#fff' : '#000';
                            ctx.font = 'bold 10px sans-serif';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(`${Math.round(prob * 100)}%`, x, y);
                        }
                    }
                }
            }

            // 着手ハイライト
            if (moveHistory.length > 0) {
                const last = moveHistory[moveHistory.length - 1];
                const x = PADDING + last.c * CELL_SIZE;
                const y = PADDING + last.r * CELL_SIZE;
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#ffb700';
                ctx.fill();
            }
        }

        // クリック処理
        function handleCanvasClick(e) {
            if (gameOver || isMeasuring || awaitActionChoice || !gameStarted) return;
            if (gameMode === 'online' && turn !== myRole) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const c = Math.round((x - PADDING) / CELL_SIZE);
            const r = Math.round((y - PADDING) / CELL_SIZE);

            if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE) {
                if (!board[r][c]) {
                    placeStone(r, c);
                }
            }
        }

        // 石を置く（この時点では手番は終了しない）
        function placeStone(r, c) {
            const count = turn === 'P1' ? p1TurnCount : p2TurnCount;
            const prob = getNextBlackProbability(turn, count);

            board[r][c] = {
                owner: turn,
                blackProb: prob,
                collapsed: false,
                finalColor: null
            };

            moveHistory.push({ r, c, player: turn });

            if (turn === 'P1') p1TurnCount++;
            else p2TurnCount++;

            playSound('place');
            log(`${turn}: (${r+1}, ${c+1}) に ${Math.round(prob*100)}% 黒石を配置`);

            // 観測選択モードへ
            awaitActionChoice = true;

            if (gameMode === 'online') {
                syncOnlineState();
            } else {
                updateUI();
                drawBoard();

                if (gameMode === 'ai' && turn === 'P2') {
                    // AIの場合はランダムで観測判断
                    setTimeout(() => {
                        if (Math.random() < 0.3 && p2ObsLeft > 0) {
                            triggerObservation();
                        } else {
                            finishTurnWithoutObservation();
                        }
                    }, 500);
                }
            }
        }

        // 観測実行
        function triggerObservation() {
            if (gameOver || isMeasuring) return;

            const obsLeft = turn === 'P1' ? p1ObsLeft : p2ObsLeft;
            if (obsLeft <= 0) {
                alert("観測可能回数が残っていません！");
                return;
            }

            if (turn === 'P1') p1ObsLeft--;
            else p2ObsLeft--;

            executeCollapseLogic(turn);
        }

        // 観測を行わずにターン終了
        function finishTurnWithoutObservation() {
            awaitActionChoice = false;
            turn = turn === 'P1' ? 'P2' : 'P1';

            if (gameMode === 'online') {
                syncOnlineState();
            } else {
                updateUI();
                drawBoard();

                if (gameMode === 'ai' && turn === 'P2' && !gameOver) {
                    setTimeout(makeAIMove, 400);
                }
            }
        }

        // 観測収束処理
        function executeCollapseLogic(observer) {
            isMeasuring = true;
            awaitActionChoice = false;
            playSound('observe');
            log(`⚛️ ${observer} が観測を実行！波動関数が収束します...`);

            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] && !board[r][c].collapsed) {
                        const rand = Math.random();
                        board[r][c].collapsed = true;
                        board[r][c].finalColor = rand < board[r][c].blackProb ? 'black' : 'white';
                    }
                }
            }

            drawBoard();

            // 勝敗判定（両者同時成立時のルール含む）
            const result = checkWinnerDetailed();

            if (result.hasBlack && result.hasWhite) {
                // 【ルール改修】両者同時に5連が揃った場合は「観測者」の勝利！
                playSound('win');
                gameOver = true;
                const winnerName = observer === 'P1' ? 'P1 (黒)' : 'P2 (白)';
                showBanner("観測成功！ (同時成立ルール)", `両者のラインが完成！観測者 [${winnerName}] の勝利！`);
                log(`🏆 黒・白両方の5連が成立！観測者 ${winnerName} の勝ち！`);
            } else if (result.hasBlack || result.hasWhite) {
                playSound('win');
                gameOver = true;
                const winnerName = result.hasBlack ? 'P1 (黒)' : 'P2 (白)';
                showBanner("観測成功！勝利確定", `${winnerName} の5連が揃いました！`);
                log(`🏆 ${winnerName} の勝利！`);
            } else {
                // 決定打なし → 元の重ね合わせ状態に復元
                setTimeout(() => {
                    playSound('revert');
                    for (let r = 0; r < BOARD_SIZE; r++) {
                        for (let c = 0; c < BOARD_SIZE; c++) {
                            if (board[r][c]) {
                                board[r][c].collapsed = false;
                                board[r][c].finalColor = null;
                            }
                        }
                    }
                    isMeasuring = false;
                    turn = turn === 'P1' ? 'P2' : 'P1';
                    log("⚠️ 決定打なし。盤面は元の量子状態へ復元されました。");
                    
                    if (gameMode === 'online') {
                        syncOnlineState();
                    } else {
                        updateUI();
                        drawBoard();

                        if (gameMode === 'ai' && turn === 'P2' && !gameOver) {
                            setTimeout(makeAIMove, 400);
                        }
                    }
                }, 1500);
            }

            if (gameMode === 'online') {
                syncOnlineState();
            } else {
                updateUI();
            }
        }

        // 詳細勝利チェック（黒・白それぞれの完成状況を返す）
        function checkWinnerDetailed() {
            let hasBlack = false;
            let hasWhite = false;
            const dirs = [[0,1], [1,0], [1,1], [1,-1]];

            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = board[r][c];
                    if (cell && cell.collapsed) {
                        const color = cell.finalColor;
                        for (let [dr, dc] of dirs) {
                            let cnt = 1;
                            for (let i = 1; i < 5; i++) {
                                const nr = r + dr * i;
                                const nc = c + dc * i;
                                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                                    if (board[nr][nc] && board[nr][nc].collapsed && board[nr][nc].finalColor === color) {
                                        cnt++;
                                    } else break;
                                } else break;
                            }
                            if (cnt >= 5) {
                                if (color === 'black') hasBlack = true;
                                if (color === 'white') hasWhite = true;
                            }
                        }
                    }
                }
            }
            return { hasBlack, hasWhite };
        }

        // UI更新
        function updateUI() {
            // ロール表示
            const roleDisp = document.getElementById('role-display');
            if (gameMode === 'online') {
                roleDisp.innerText = myRole ? `あなた: ${myRole === 'P1' ? 'P1 (黒)' : 'P2 (白)'}` : "対戦待ち";
            } else {
                roleDisp.innerText = "ローカル対戦モード";
            }

            // 手番表示
            const turnDisp = document.getElementById('turn-display');
            if (!gameStarted) {
                turnDisp.innerText = "マッチング・準備待ち";
                turnDisp.className = "status-badge status-wait";
            } else {
                const isMyTurn = (gameMode !== 'online') || (turn === myRole);
                if (isMyTurn) {
                    turnDisp.innerText = `あなたの手番 (${turn})`;
                    turnDisp.className = "status-badge status-my-turn";
                } else {
                    turnDisp.innerText = `相手の思考中... (${turn})`;
                    turnDisp.className = "status-badge status-wait";
                }
            }

            // 確率表示
            const count = turn === 'P1' ? p1TurnCount : p2TurnCount;
            const prob = getNextBlackProbability(turn, count);
            document.getElementById('next-prob-display').innerText = `${Math.round(prob * 100)}% 黒`;

            // 観測残数
            document.getElementById('p1-obs-count').innerText = `${p1ObsLeft} 回`;
            document.getElementById('p2-obs-count').innerText = `${p2ObsLeft} 回`;

            // 石配置後のアクション分岐表示
            const actionBox = document.getElementById('action-choice-box');
            const isMyTurn = (gameMode !== 'online') || (turn === myRole);
            if (awaitActionChoice && isMyTurn && !gameOver) {
                actionBox.style.display = 'flex';
                const currentObsLeft = turn === 'P1' ? p1ObsLeft : p2ObsLeft;
                document.getElementById('btn-observe').disabled = currentObsLeft <= 0;
            } else {
                actionBox.style.display = 'none';
            }
        }

        function log(msg) {
            const logBox = document.getElementById('log-box');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerText = msg;
            logBox.appendChild(entry);
        }

        function showBanner(title, text) {
            document.getElementById('banner-title').innerText = title;
            document.getElementById('banner-text').innerText = text;
            document.getElementById('banner').style.display = 'block';
        }

        // 簡易AI
        function makeAIMove() {
            if (gameOver || turn !== 'P2') return;

            let empties = [];
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (!board[r][c]) empties.push({ r, c });
                }
            }

            if (empties.length > 0) {
                empties.sort((a,b) => (Math.abs(a.r-7)+Math.abs(a.c-7)) - (Math.abs(b.r-7)+Math.abs(b.c-7)));
                const pick = empties[Math.floor(Math.random() * Math.min(5, empties.length))];
                placeStone(pick.r, pick.c);
            }
        }

        // === オンライン対戦機能 ===
        function createOnlineRoom() {
            if (!db) { alert("Firebase設定が入力されていません！"); return; }
            roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
            myRole = 'P1';

            document.getElementById('created-room-id').innerText = roomId;
            document.getElementById('room-id-box').style.display = 'flex';
            document.getElementById('btn-create-room').style.display = 'none';
            document.getElementById('join-input-box').style.display = 'none';
            document.getElementById('btn-ready').style.display = 'block';

            const roomRef = db.ref('rooms/' + roomId);
            roomRef.set({
                board: JSON.stringify(board),
                turn: 'P1',
                p1TurnCount: 0,
                p2TurnCount: 0,
                p1ObsLeft: 5,
                p2ObsLeft: 5,
                p1Ready: false,
                p2Ready: false,
                gameStarted: false,
                gameOver: false,
                isMeasuring: false,
                awaitActionChoice: false
            });

            document.getElementById('online-status').innerText = `ルーム作成完了！対戦相手の参加を待っています...`;
            log(`🌐 ルーム作成 ID: ${roomId}`);
            listenToOnlineRoom();
        }

        function joinOnlineRoom() {
            if (!db) { alert("Firebase設定が入力されていません！"); return; }
            const inputCode = document.getElementById('room-input').value.trim().toUpperCase();
            if (!inputCode) return;

            roomId = inputCode;
            myRole = 'P2';

            db.ref('rooms/' + roomId).once('value', snapshot => {
                if (snapshot.exists()) {
                    document.getElementById('btn-create-room').style.display = 'none';
                    document.getElementById('join-input-box').style.display = 'none';
                    document.getElementById('btn-ready').style.display = 'block';
                    document.getElementById('online-status').innerText = `ルーム ${roomId} にマッチングしました！準備完了を押してください。`;
                    log(`🌐 ルーム ${roomId} に参加しました。`);
                    listenToOnlineRoom();
                } else {
                    alert("指定されたルームが見つかりません。");
                }
            });
        }

        function copyRoomId() {
            if (!roomId) return;
            navigator.clipboard.writeText(roomId).then(() => {
                alert(`ルームID [${roomId}] をクリップボードにコピーしました！`);
            });
        }

        function toggleReady() {
            if (!db || !roomId) return;
            const ref = db.ref(`rooms/${roomId}/${myRole === 'P1' ? 'p1Ready' : 'p2Ready'}`);
            ref.set(true);
            document.getElementById('btn-ready').disabled = true;
            document.getElementById('btn-ready').innerText = "✓ 準備完了 (待機中)";
        }

        function syncOnlineState() {
            if (!db || !roomId) return;
            db.ref('rooms/' + roomId).update({
                board: JSON.stringify(board),
                turn: turn,
                p1TurnCount: p1TurnCount,
                p2TurnCount: p2TurnCount,
                p1ObsLeft: p1ObsLeft,
                p2ObsLeft: p2ObsLeft,
                gameStarted: gameStarted,
                gameOver: gameOver,
                isMeasuring: isMeasuring,
                awaitActionChoice: awaitActionChoice
            });
        }

        function listenToOnlineRoom() {
            db.ref('rooms/' + roomId).on('value', snapshot => {
                const data = snapshot.val();
                if (data) {
                    board = JSON.parse(data.board);
                    turn = data.turn;
                    p1TurnCount = data.p1TurnCount;
                    p2TurnCount = data.p2TurnCount;
                    p1ObsLeft = data.p1ObsLeft;
                    p2ObsLeft = data.p2ObsLeft;
                    p1Ready = data.p1Ready || false;
                    p2Ready = data.p2Ready || false;
                    gameStarted = data.gameStarted || false;
                    gameOver = data.gameOver;
                    isMeasuring = data.isMeasuring;
                    awaitActionChoice = data.awaitActionChoice || false;

                    // 両者Readyチェックで対局スタート
                    if (p1Ready && p2Ready && !gameStarted) {
                        gameStarted = true;
                        if (myRole === 'P1') {
                            db.ref('rooms/' + roomId).update({ gameStarted: true });
                        }
                        document.getElementById('online-status').innerText = "⚔️ 両者の準備が完了しました！対局開始！";
                        log("⚔️ マッチング完了！対局が始まりました。");
                    } else if (!gameStarted) {
                        if (p1Ready || p2Ready) {
                            document.getElementById('online-status').innerText = "相手の準備完了を待っています...";
                        }
                    }

                    updateUI();
                    drawBoard();
                }
            });
        }

        window.onload = init;
    </script>
</body>
